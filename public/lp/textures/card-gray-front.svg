<svg width="640" height="400" viewBox="0 0 640 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" /><stop offset="50%" stop-color="#1e293b" /><stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="640" height="400" rx="24" fill="url(#cardGrad)" />
  <rect x="1" y="1" width="638" height="398" rx="23" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />

  <!-- Subtle luxury light beam -->
  <path d="M0 80L340 0L240 400L0 400Z" fill="white" fill-opacity="0.04" />
  <path d="M220 0L520 0L420 400L120 400Z" fill="white" fill-opacity="0.02" />

  <!-- LeonixBank Header Logo -->
  <g transform="translate(40, 36)">
    <rect width="42" height="42" rx="11" fill="#38bdf8" />
    <path d="M21 9L31 18L27 34L21 37L15 34L11 18L21 9Z" fill="white" />
    <path d="M21 14L26 21L21 32L16 21L21 14Z" fill="#0f172a" />
    <text x="54" y="29" font-family="'Montserrat', sans-serif" font-weight="900" font-size="24" letter-spacing="-0.03em" fill="#ffffff">Leonix<tspan fill="#38bdf8">Bank</tspan></text>
  </g>

  <!-- Contactless NFC Wave -->
  <g transform="translate(545, 42)" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M0 10A10 10 0 0 1 0 30" />
    <path d="M8 5A18 18 0 0 1 8 35" />
    <path d="M16 0A26 26 0 0 1 16 40" />
  </g>

  <!-- EMV Microchip -->
  <g transform="translate(42, 140)">
    <rect width="56" height="44" rx="8" fill="url(#chipGrad)" stroke="#94a3b8" stroke-width="1" />
    <line x1="0" y1="22" x2="56" y2="22" stroke="#64748b" stroke-width="1" />
    <line x1="28" y1="0" x2="28" y2="44" stroke="#64748b" stroke-width="1" />
    <circle cx="28" cy="22" r="8" fill="none" stroke="#64748b" stroke-width="1" />
  </g>

  <!-- Embossed Card Number -->
  <text x="42" y="260" font-family="monospace, 'Courier New'" font-weight="bold" font-size="24" letter-spacing="0.22em" fill="#ffffff" filter="drop-shadow(0 2px 2px rgba(0,0,0,0.5))">
    ••••  ••••  ••••  8842
  </text>

  <!-- Cardholder Details -->
  <g transform="translate(42, 330)">
    <text x="0" y="0" font-family="'Montserrat', sans-serif" font-size="9" font-weight="700" letter-spacing="0.15em" fill="#94a3b8">TITULAR</text>
    <text x="0" y="22" font-family="'Montserrat', sans-serif" font-size="16" font-weight="800" letter-spacing="0.08em" fill="#ffffff">CARMEN SILVA</text>
  </g>

  <g transform="translate(340, 330)">
    <text x="0" y="0" font-family="'Montserrat', sans-serif" font-size="9" font-weight="700" letter-spacing="0.15em" fill="#94a3b8">VALIDADE</text>
    <text x="0" y="22" font-family="'Montserrat', sans-serif" font-size="16" font-weight="800" letter-spacing="0.08em" fill="#ffffff">11/32</text>
  </g>

  <!-- Mastercard Circles -->
  <g transform="translate(530, 315)">
    <circle cx="0" cy="18" r="24" fill="#eb001b" fill-opacity="0.9" />
    <circle cx="28" cy="18" r="24" fill="#f79e1b" fill-opacity="0.9" />
  </g>
</svg>