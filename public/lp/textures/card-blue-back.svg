<svg width="640" height="400" viewBox="0 0 640 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" /><stop offset="50%" stop-color="#1d4ed8" /><stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="640" height="400" rx="24" fill="url(#cardGradB)" />
  <rect x="1" y="1" width="638" height="398" rx="23" stroke="rgba(96, 165, 250, 0.4)" stroke-width="1.5" />

  <!-- Magnetic Stripe -->
  <rect y="40" width="640" height="65" fill="#090d16" />

  <!-- Signature & CVV Panel -->
  <rect x="40" y="145" width="380" height="45" rx="4" fill="#f8fafc" />
  <text x="55" y="174" font-family="'Caveat', cursive, sans-serif" font-size="22" fill="#334155">Carmen Silva</text>

  <rect x="425" y="145" width="70" height="45" rx="4" fill="#e2e8f0" />
  <text x="442" y="173" font-family="monospace" font-weight="bold" font-size="16" fill="#0f172a">492</text>
  <text x="425" y="135" font-family="sans-serif" font-size="9" font-weight="bold" fill="#93c5fd">CVV</text>

  <!-- Bank Info Text -->
  <text x="40" y="230" font-family="'Montserrat', sans-serif" font-size="10" fill="#93c5fd">
    LeonixBank Instituição de Pagamento S.A. · Ouvidoria: 0800 722 0480
  </text>
  <text x="40" y="248" font-family="'Montserrat', sans-serif" font-size="10" fill="#93c5fd">
    Uso nacional e internacional · Central de Atendimento 24h: 3003-0480
  </text>

  <!-- Security Hologram Badge -->
  <rect x="40" y="300" width="55" height="40" rx="6" fill="none" stroke="#93c5fd" stroke-width="1.5" />
  <text x="48" y="324" font-family="sans-serif" font-weight="900" font-size="10" fill="#60a5fa">LEONIX</text>
